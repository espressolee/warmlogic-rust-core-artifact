[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "warm_logic_rs"
# Was 0.4.0+kinetic while Cargo.toml said 1.1.0 — the extension and the crate
# it is built from disagreed about their own version. Single-valued now.
version = "1.1.0"
dependencies = []

[tool.maturin]
# "zk" is NOT listed: that feature does not compile (22 errors, unresolved
# `crate::zk::plonk_engine` / unlinked `dusk_plonk`). Declaring it here made
# `pip install ./rust_core` attempt a build that cannot succeed. See
# docs/CLAIM_EVIDENCE.md — ZK is IMPLEMENTED_NOT_BUILDABLE.
features = ["python"]
module-name = "warm_logic_rs"
binding = "pyo3"
