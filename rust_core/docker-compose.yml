version: '3.8'

services:
  # ==============================================================================
  # Development: Rust Core Library
  # ==============================================================================
  rust-core:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: warmlogic/rust-core:1.0.1
    container_name: warmlogic-rust-core
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/app/libwarm_logic_rs.so"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ==============================================================================
  # Development: Python Bindings
  # ==============================================================================
  python-bindings:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-runtime
    image: warmlogic/python-bindings:1.0.1
    container_name: warmlogic-python
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./scripts:/app/scripts:ro
    command: ["python", "-c", "import warm_logic_rs; print('Ready')"]

  # ==============================================================================
  # Testing: Run test suite
  # ==============================================================================
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: warmlogic-test
    command: ["cargo", "test", "--all-features"]
    volumes:
      - ./src:/build/src:ro
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/build/target

  # ==============================================================================
  # Security: Audit dependencies
  # ==============================================================================
  audit:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: warmlogic-audit
    command: >
      sh -c "cargo install cargo-audit &&
             cargo audit --ignore RUSTSEC-2024-0388
                        --ignore RUSTSEC-2025-0119
                        --ignore RUSTSEC-2024-0436
                        --ignore RUSTSEC-2026-0002"
    volumes:
      - cargo-cache:/usr/local/cargo/registry

volumes:
  cargo-cache:
  target-cache:

networks:
  default:
    name: warmlogic-network
    driver: bridge
