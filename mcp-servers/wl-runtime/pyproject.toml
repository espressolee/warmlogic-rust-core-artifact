[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wl-runtime-mcp"
version = "1.0.0"
description = "WarmLogic Runtime MCP Server"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
wl-runtime-mcp = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
