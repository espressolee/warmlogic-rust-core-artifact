# ---------- Base settings ----------
set -g default-terminal "screen-256color"
set -g mouse on
set -g history-limit 20000

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g pane-border-status top
set -g pane-border-format " #{pane_index} :: #{pane_title} "
set -g status-left "#S "
set -g status-right "#(date '+%H:%M') | WL"

# Set Warm Logic paths automatically
set-environment -g WL_ROOT "$HOME/WarmLogic"
set-environment -g DEV_ENV "$WL_ROOT/dev_env"

bind-key w run-shell "$DEV_ENV/tmux_restore.sh"

bind-key 1 run-shell 'tmux has-session -t warmlogic 2>/dev/null && tmux switch-client -t warmlogic || tmux new-session -d -s warmlogic -c "$WL_ROOT"; tmux new-window -t warmlogic:1 -n dev -c "$WL_ROOT" "\
  zsh"; tmux split-window -h -c "$WL_ROOT" "\
  zsh"; tmux select-window -t warmlogic:1'

bind-key a new-window -n auto-dev -c "$WL_ROOT" "bash model/run_all.sh auto-dev; zsh"
bind-key s new-window -n scheduler -c "$WL_ROOT" "bash model/run_all.sh scheduler; zsh"
bind-key d new-window -n dashboard -c "$WL_ROOT" "bash model/run_all.sh dashboard; zsh"
bind-key t new-window -n tests -c "$WL_ROOT" "pytest -q -m 'not slow'; zsh"

bind-key p split-window -v -c "$WL_ROOT" "$DEV_ENV/wl_patch_history_watch"

bind-key r send-keys "git status" C-m
