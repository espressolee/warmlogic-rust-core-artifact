apiVersion: v1
kind: Service
metadata:
  name: warmlogic-gateway-headless
  namespace: warmlogic-production
  labels:
    app: warmlogic
    component: gateway
spec:
  clusterIP: None
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: warmlogic
    component: gateway
