apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: warmlogic-production

commonLabels:
  environment: production
  managed-by: kustomize

resources:
  # Core Gateway
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - service-headless.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  # Federation
  - federation-statefulset.yaml
  - federation-service.yaml
  - federation-service-external.yaml
  - federation-configmap.yaml
  - federation-networkpolicy.yaml
  - federation-pdb.yaml

images:
  - name: ghcr.io/espressolee/warmlogic
    newTag: v1.0.0
