# WarmLogic Federation External Service
# LoadBalancer for cross-cluster federation
apiVersion: v1
kind: Service
metadata:
  name: warmlogic-federation-external
  namespace: warmlogic-production
  labels:
    app: warmlogic
    component: federation
  annotations:
    # Cloud-specific annotations for internal LB
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    cloud.google.com/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app: warmlogic
    component: federation
  ports:
    - name: federation
      port: 17300
      targetPort: 17300
      protocol: TCP
