apiVersion: v1
kind: Secret
metadata:
  name: warmlogic-secrets
  namespace: warmlogic-production
  labels:
    app: warmlogic
  annotations:
    # For production, use ExternalSecrets or sealed-secrets:
    # external-secrets.io/secretStoreRef: vault-backend
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual secrets in production
  # Use external secret management (Vault, AWS Secrets Manager, etc.)
  WARMLOGIC_API_KEY: "REPLACE_WITH_ACTUAL_API_KEY"
  SOVEREIGN_COCKPIT_KEY: "REPLACE_WITH_ACTUAL_COCKPIT_KEY"
