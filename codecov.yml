# Codecov Configuration
# See: https://docs.codecov.io/docs/codecovyml-reference

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: 80%
        informational: false

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes

flags:
  ubuntu-latest:
    paths:
      - warm_logic/kernel/
    carryforward: true
  macos-latest:
    paths:
      - warm_logic/kernel/
    carryforward: true
  windows-latest:
    paths:
      - warm_logic/kernel/
    carryforward: true
# Carryforward allows coverage from a previous commit to be used if a flag is missing
# This enables true cross-OS coverage merging
