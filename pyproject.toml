[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python"]
python-source = "src"
module-name = "warm_logic_rs.warm_logic_rs"
manifest-path = "rust_core/Cargo.toml"
include = ["src/warm_logic/**/*"]

[project]
name = "warm_logic"
version = "1.1.0"
description = "Post-quantum governance kernel: Rust crypto/consensus core with Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "espressolee", email = "70549809+espressolee@users.noreply.github.com" }
]
keywords = ["pqc", "bft", "sovereign", "ai", "governance", "mesh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
urls = { Homepage = "https://github.com/espressolee/WarmLogic", Repository = "https://github.com/espressolee/WarmLogic", Documentation = "https://github.com/espressolee/WarmLogic/tree/main/docs" }
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.29.0",
    "typer>=0.12.0",
    "anyio>=4.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "python-json-logger>=2.0.7",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.3.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "pip-tools>=7.4.1",
    "mutmut>=2.4.4",
    "cyclonedx-bom>=3.11.0",
    # Additional test dependencies
    "hypothesis>=6.100.0",
    "psutil>=5.9.0",
    "toml>=0.10.0",
    "redis>=5.0.0",
    "chromadb>=0.4.0",
    "duckdb>=0.10.0",
    "networkx>=3.0",
    "opentelemetry-api>=1.20.0",
]
ui = [
    "dash>=2.16.1",
    "scipy>=1.13.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.1",
]
eval = [
    "matplotlib>=3.8.4",
]
semantic = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.0",
]

[project.scripts]
wlctl = "warm_logic.app.cli.wlctl:main"


[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
# Disable strict checks globally - enable per-module
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Strict modules (already fixed)
[[tool.mypy.overrides]]
module = [
    "warm_logic.kernel.learning.experience_replay",
    "warm_logic.kernel.learning.online_learning",
    "warm_logic.kernel.world.simulation",
    "warm_logic.kernel.world.neural_world",
    "warm_logic.kernel.world.spatial",
    "warm_logic.kernel.world.causal",
    "warm_logic.kernel.intelligence.adaptive_replan",
    "warm_logic.kernel.intelligence.goal_chaining",
    "warm_logic.kernel.intelligence.knowledge_graph",
    "warm_logic.kernel.intelligence.tree_of_thought",
    "warm_logic.kernel.safety.formal_invariants",
    "warm_logic.kernel.transaction",
    "warm_logic.kernel.mesh.plugins",
    "warm_logic.kernel.sys.sovereign_intelligence",
    "warm_logic.kernel.drone.physics",
    "warm_logic.kernel.drone.mission",
    "warm_logic.kernel.memory.temporal_decay",
    "warm_logic.kernel.memory.engine",
    "warm_logic.kernel.agent.proactive",
    "warm_logic.kernel.substrate.heartbeat",
    "warm_logic.kernel.evolution.mcts_planner",
    "warm_logic.kernel.evolution.evaluation_loop",
    "warm_logic.system.fleet.manager",
    "warm_logic.kernel.autonomy.budget",
    "warm_logic.kernel.mesh.galaxy",
]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
