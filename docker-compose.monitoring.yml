version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.51.1
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sovereign-net

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sovereign
    depends_on:
      - prometheus
    networks:
      - sovereign-net

  kernel-node:
    build: .
    ports:
      - "8000:8000"
    command: python3 -m warm_logic.app.cockpit.server
    environment:
      - SOVEREIGN_COCKPIT_KEY=test-key-123
      - COCKPIT_HTTP_PORT=8000
    networks:
      - sovereign-net

networks:
  sovereign-net:
    driver: bridge
