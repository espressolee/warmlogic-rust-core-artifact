{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "warmlogic.serviceAccountName" . }}
  labels:
    {{- include "warmlogic.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "warmlogic.fullname" . }}-role
  labels:
    {{- include "warmlogic.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "warmlogic.fullname" . }}-rolebinding
  labels:
    {{- include "warmlogic.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "warmlogic.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "warmlogic.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
