{{- if and .Values.monitoring.enabled .Values.monitoring.prometheus.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "warmlogic.fullname" . }}
  labels:
    {{- include "warmlogic.labels" . | nindent 4 }}
    release: prometheus
spec:
  selector:
    matchLabels:
      {{- include "warmlogic.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'warmlogic_.*'
          action: keep
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
