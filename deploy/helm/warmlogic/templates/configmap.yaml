apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "warmlogic.fullname" . }}-config
  labels:
    {{- include "warmlogic.labels" . | nindent 4 }}
data:
  WARMLOGIC_WORKER_COUNT: {{ .Values.warmlogic.performance.workerCount | quote }}
  WARMLOGIC_MAX_CONNECTIONS: {{ .Values.warmlogic.performance.maxConnections | quote }}
  WARMLOGIC_TIMEOUT_SECONDS: {{ .Values.warmlogic.performance.timeoutSeconds | quote }}
  WARMLOGIC_TLS_ENABLED: {{ .Values.warmlogic.security.tlsEnabled | quote }}
  WARMLOGIC_AUDIT_ENABLED: {{ .Values.warmlogic.security.auditEnabled | quote }}
