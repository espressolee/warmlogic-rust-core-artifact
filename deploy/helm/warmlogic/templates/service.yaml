apiVersion: v1
kind: Service
metadata:
  name: {{ include "warmlogic.fullname" . }}
  labels:
    {{- include "warmlogic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9000
      targetPort: 9000
      protocol: UDP
      name: mesh
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    {{- include "warmlogic.selectorLabels" . | nindent 4 }}
---
# Headless service for StatefulSet (mesh node discovery)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "warmlogic.fullname" . }}-headless
  labels:
    {{- include "warmlogic.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9000
      targetPort: 9000
      protocol: UDP
      name: mesh
  selector:
    {{- include "warmlogic.selectorLabels" . | nindent 4 }}
