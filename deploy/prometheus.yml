# WarmLogic Prometheus Configuration
# Phase C: Infrastructure Expansion

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'warmlogic-sovereign'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      timeout: 10s

# Rule files for alerting
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # WarmLogic Kernel Metrics
  - job_name: "warmlogic-kernel"
    static_configs:
      - targets: ["warmlogic:8080"]
        labels:
          service: "kernel"
          component: "core"
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # Rust Core Crypto Metrics
  - job_name: "warmlogic-rust-core"
    static_configs:
      - targets: ["warmlogic:8080"]
        labels:
          service: "rust-core"
          component: "crypto"
    metrics_path: "/metrics/rust"
    scrape_interval: 10s

  # BFT Consensus Metrics
  - job_name: "warmlogic-consensus"
    static_configs:
      - targets: ["warmlogic:8080"]
        labels:
          service: "consensus"
          component: "bft"
    metrics_path: "/metrics/consensus"
    scrape_interval: 5s
    scrape_timeout: 3s

  # Mesh Network Metrics
  - job_name: "warmlogic-mesh"
    static_configs:
      - targets: ["warmlogic:8080"]
        labels:
          service: "mesh"
          component: "p2p"
    metrics_path: "/metrics/mesh"
    scrape_interval: 15s

  # Governance Engine Metrics
  - job_name: "warmlogic-governance"
    static_configs:
      - targets: ["warmlogic:8080"]
        labels:
          service: "governance"
          component: "policy"
    metrics_path: "/metrics/governance"
    scrape_interval: 30s

  # Security (Aegis) Metrics
  - job_name: "warmlogic-security"
    static_configs:
      - targets: ["warmlogic:8080"]
        labels:
          service: "security"
          component: "aegis"
    metrics_path: "/metrics/security"
    scrape_interval: 30s

  # ZK Proof Generation Metrics
  - job_name: "warmlogic-zkp"
    static_configs:
      - targets: ["warmlogic:8080"]
        labels:
          service: "zkp"
          component: "proofs"
    metrics_path: "/metrics/zkp"
    scrape_interval: 15s

  # Federated Learning Metrics
  - job_name: "warmlogic-federated"
    static_configs:
      - targets: ["warmlogic:8080"]
        labels:
          service: "federated"
          component: "ml"
    metrics_path: "/metrics/federated"
    scrape_interval: 60s

  # Multi-node cluster discovery
  - job_name: "warmlogic-cluster"
    dns_sd_configs:
      - names:
          - "warmlogic-node.warmlogic.svc.cluster.local"
        type: "A"
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):8080"
        replacement: "$1"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "monitoring"
          component: "prometheus"

  # Node Exporter (if deployed)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "infrastructure"
          component: "node"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __host__
        regex: "(.+):9100"
        replacement: "$1"
