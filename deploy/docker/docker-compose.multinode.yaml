# WarmLogic Multi-Node Test Environment
# Docker Compose for 3-node mesh testing
#
# Usage:
#   docker compose -f docker-compose.multinode.yaml up -d
#   docker compose -f docker-compose.multinode.yaml logs -f
#   docker compose -f docker-compose.multinode.yaml down

services:
  # Seed Node (Bootstrap)
  warmlogic-node-0:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: warmlogic-node-0
    hostname: node-0
    environment:
      - WARMLOGIC_NODE_ID=0
      - WARMLOGIC_GATEWAY_PORT=8000
      - WARMLOGIC_ROLE=seed
      - WARMLOGIC_LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
      - WARMLOGIC_BOOTSTRAP_NODES=
    ports:
      - "8000:8000"
      - "9000:9000/udp"
      - "9090:9090"
    volumes:
      - node0-data:/app/data
    networks:
      warmlogic-mesh:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Mesh Node 1
  warmlogic-node-1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: warmlogic-node-1
    hostname: node-1
    environment:
      - WARMLOGIC_NODE_ID=1
      - WARMLOGIC_GATEWAY_PORT=8000
      - WARMLOGIC_ROLE=mesh
      - WARMLOGIC_LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
      - WARMLOGIC_BOOTSTRAP_NODES=172.28.0.10:9000
    ports:
      - "8001:8000"
      - "9001:9000/udp"
      - "9091:9090"
    volumes:
      - node1-data:/app/data
    networks:
      warmlogic-mesh:
        ipv4_address: 172.28.0.11
    depends_on:
      warmlogic-node-0:
        condition: service_healthy

  # Mesh Node 2
  warmlogic-node-2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: warmlogic-node-2
    hostname: node-2
    environment:
      - WARMLOGIC_NODE_ID=2
      - WARMLOGIC_GATEWAY_PORT=8000
      - WARMLOGIC_ROLE=mesh
      - WARMLOGIC_LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
      - WARMLOGIC_BOOTSTRAP_NODES=172.28.0.10:9000,172.28.0.11:9000
    ports:
      - "8002:8000"
      - "9002:9000/udp"
      - "9092:9090"
    volumes:
      - node2-data:/app/data
    networks:
      warmlogic-mesh:
        ipv4_address: 172.28.0.12
    depends_on:
      warmlogic-node-0:
        condition: service_healthy
      warmlogic-node-1:
        condition: service_started

networks:
  warmlogic-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  node0-data:
  node1-data:
  node2-data:
