apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: warmlogic
  namespace: argocd
  labels:
    app.kubernetes.io/name: warmlogic
    app.kubernetes.io/part-of: warmlogic-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/espressolee/WarmLogic.git
    targetRevision: HEAD
    path: deploy/helm/warmlogic
    helm:
      releaseName: warmlogic
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: latest

  destination:
    server: https://kubernetes.default.svc
    namespace: warmlogic

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
