[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off

[INPUT]
    Name              tail
    Path              /var/log/warmlogic/*.log
    Tag               warmlogic.*
    Read_from_Head    true
    
[INPUT]
    Name              tail
    Path              /var/log/warmlogic/audit/*.json
    Tag               audit.*
    Parser            json
    Read_from_Head    true

[FILTER]
    Name              record_modifier
    Match             *
    Record            hostname ${HOSTNAME}
    Record            service warmlogic

[OUTPUT]
    Name              file
    Match             audit.*
    Path              /audit
    File              audit.log
    Format            json_lines
    
[OUTPUT]
    Name              stdout
    Match             warmlogic.*
    Format            json_lines
