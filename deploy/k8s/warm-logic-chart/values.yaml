replicaCount: 100

image:
  repository: warmlogic/sovereign-node
  pullPolicy: IfNotPresent
  tag: "latest"

config:
  env: "production"
  logLevel: "INFO"
  wanMode: "1"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

service:
  type: ClusterIP
  port: 5000
