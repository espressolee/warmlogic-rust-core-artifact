[pytest]
testpaths = tests src/warm_logic/kernel/tests
norecursedirs =
    .git
    .venv
    venv
    out
    archives
    build
    dist
    node_modules
    docs
    models
    data
    __pycache__
    *.egg-info
    .pytest_cache
    .hypothesis
    .mypy_cache
    .ruff_cache
    rust_core/target
    site-packages
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
